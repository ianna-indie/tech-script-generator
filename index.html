<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Script Generator · indie.io</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#1F1D3A; --ink-soft:#5B5880; --paper:#FFFFFF; --wash:#F6F5FF; --lav:#ECEAFF;
  --indigo:#373278; --indigo-deep:#08071A; --pink:#FF9999; --pink-wash:#FFE3E3; --pink-ink:#A3343A;
  --line:#D6D3F0; --ok:#2F7A4E; --warn:#A3343A;
  --r-s:6px; --r-m:10px;
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECEAFF; --ink-soft:#A9A5D6; --paper:#13112B; --wash:#0D0C22; --lav:#24204F;
    --indigo:#8E87F0; --indigo-deep:#050412; --pink:#FF9999; --pink-wash:#3A1D27; --pink-ink:#FFB3B3;
    --line:#2E2A5E; --ok:#7FD4A0; --warn:#FFB3B3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ECEAFF; --ink-soft:#A9A5D6; --paper:#13112B; --wash:#0D0C22; --lav:#24204F;
  --indigo:#8E87F0; --indigo-deep:#050412; --pink:#FF9999; --pink-wash:#3A1D27; --pink-ink:#FFB3B3;
  --line:#2E2A5E; --ok:#7FD4A0; --warn:#FFB3B3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--wash);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr}}

/* Step rail */
.rail{background:var(--indigo-deep);color:#ECEAFF;padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
@media (max-width:820px){.rail{position:static;height:auto;padding:18px 16px;gap:14px}}
.brand{font-stretch:125%;font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:13px;color:#A9A5D6;margin-top:6px;letter-spacing:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.steps{flex-direction:row;overflow-x:auto;gap:6px}}
.steps button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:var(--r-s);display:flex;gap:12px;align-items:baseline;cursor:pointer;color:#C9C5F2;white-space:nowrap}
.steps button .n{font-variant-numeric:tabular-nums;font-weight:700;color:#6F6AB8;min-width:1.4em}
.steps button[aria-current="step"]{background:#373278;color:#fff}
.steps button[aria-current="step"] .n{color:var(--pink)}
.steps button:hover{background:#1B1840}
.rail .foot{margin-top:auto;font-size:12px;color:#8A86C4}
@media (max-width:820px){.rail .foot{margin-top:0}}
.rail .btn{background:#1B1840;border-color:#373278;color:#fff}

main{padding:36px clamp(16px,4vw,56px) 80px;max-width:1180px;width:100%}
h1{font-stretch:118%;font-weight:800;font-size:clamp(26px,3.2vw,38px);line-height:1.05;margin:0 0 6px;letter-spacing:-.015em}
.lede{color:var(--ink-soft);margin:0 0 28px;max-width:68ch}
h2{font-stretch:110%;font-weight:700;font-size:18px;margin:28px 0 12px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
label.f span.h{font-weight:400;color:var(--ink-soft)}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;width:100%;font-weight:400;font-size:14px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.wide{grid-column:1/-1}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-s);padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08071A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#08071A}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.note{font-size:13px;color:var(--ink-soft)}
.err{color:var(--warn);font-size:14px;font-weight:600}
.okc{color:var(--ok);font-weight:600}

/* Drop zone */
.drop{border:2px dashed var(--line);border-radius:var(--r-m);padding:28px;text-align:center;background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--indigo);background:var(--lav)}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.src{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column}
.src .thumb{aspect-ratio:16/9;background:#08071A;display:flex;align-items:center;justify-content:center;color:#8A86C4;font-size:12px}
.src .thumb img{width:100%;height:100%;object-fit:cover}
.src .meta{padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.src .meta b{word-break:break-all;font-weight:600}

/* Film strip — the one bold element */
.strip{background:#08071A;border-radius:var(--r-s);padding:14px 10px;position:relative;overflow-x:auto}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background-image:radial-gradient(circle at 6px 4px,#2A2660 2.6px,transparent 3px);background-size:16px 8px;pointer-events:none}
.strip::before{top:3px}.strip::after{bottom:3px}
.frames{display:flex;gap:8px;min-width:min-content}
.fr{position:relative;width:184px;flex:none;border:2px solid transparent;border-radius:4px;background:#14123A;cursor:pointer;padding:0;color:#ECEAFF;text-align:left}
.fr img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px}
.fr .tc{position:absolute;left:6px;top:6px;background:rgba(8,7,26,.82);font-size:11px;padding:1px 6px;border-radius:3px;font-variant-numeric:tabular-nums;font-weight:600}
.fr .opt{position:absolute;right:6px;top:6px;background:var(--pink);color:#08071A;font-size:11px;font-weight:800;padding:1px 6px;border-radius:3px}
.fr .cap{display:block;font-size:11px;padding:5px 6px;color:#A9A5D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr[aria-pressed="true"]{border-color:var(--pink)}
.fr .rec{position:absolute;left:6px;bottom:24px;background:#373278;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}
.strip .empty{color:#A9A5D6;font-size:13px;padding:22px 8px}

/* Shot cards */
.toolbar{position:sticky;top:0;z-index:5;background:var(--wash);padding:10px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}
.counter{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 10px;border-radius:var(--r-s);background:var(--lav);font-size:13px}
.counter.over{background:var(--pink-wash);color:var(--pink-ink)}
.shot{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);margin:14px 0;display:grid;grid-template-columns:64px 1fr}
@media (max-width:700px){.shot{grid-template-columns:1fr}}
.shot .num{background:var(--indigo);color:#fff;font-stretch:125%;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;border-radius:var(--r-m) 0 0 var(--r-m);font-variant-numeric:tabular-nums}
@media (max-width:700px){.shot .num{flex-direction:row;justify-content:flex-start;padding:8px 14px;border-radius:var(--r-m) var(--r-m) 0 0}}
.shot .num button{background:none;border:0;color:#C9C5F2;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.shot .num button:hover{background:rgba(255,255,255,.12);color:#fff}
.shot .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.shot .purpose{font-size:13px;color:var(--ink-soft)}
.cols3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.cols3{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--pink-wash);color:var(--pink-ink);padding:3px 8px;border-radius:999px;font-weight:600}
.reason{font-size:13px;background:var(--lav);border-radius:var(--r-s);padding:8px 10px}
.manual{font-size:11px;font-weight:700;color:var(--ok)}

/* Progress */
.log{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
.bar{height:6px;background:var(--lav);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s}

/* Modal */
dialog{border:0;border-radius:var(--r-m);padding:0;max-width:min(960px,94vw);width:100%;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(8,7,26,.6)}
dialog .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
dialog .hd h3{margin:0;font-stretch:110%;font-size:17px}
dialog .bd{padding:16px 20px;max-height:70vh;overflow:auto}
.allframes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;background:#08071A;padding:10px;border-radius:var(--r-s)}
.allframes .fr{width:auto}

.ws{max-width:98vw!important;width:98vw;height:94vh}
.ws .bd{max-height:none;height:calc(94vh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;overflow:hidden}
@media (max-width:900px){.ws .bd{grid-template-columns:1fr;overflow:auto;height:auto}}
.ws .stage{display:flex;flex-direction:column;gap:10px;min-height:0}
.ws video{width:100%;flex:1;min-height:200px;max-height:68vh;background:#08071A;border-radius:6px;object-fit:contain}
.ws .tcbig{font-variant-numeric:tabular-nums;font-weight:800;font-stretch:115%;font-size:22px}
.ws .keys{font-size:12px;color:var(--ink-soft)}
.ws .keys b{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 2px;font-weight:700;color:var(--ink)}
.ws .shots{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.ws .sh{display:grid;grid-template-columns:34px 88px 1fr;gap:8px;align-items:center;text-align:left;background:var(--wash);border:1px solid var(--line);border-radius:var(--r-s);padding:6px;cursor:pointer;font-size:12px}
.ws .sh[aria-current="true"]{border-color:var(--pink);background:var(--lav);box-shadow:inset 3px 0 0 var(--pink)}
.ws .sh .no{font-weight:800;font-variant-numeric:tabular-nums;color:var(--indigo);text-align:center}
.ws .sh .im{aspect-ratio:16/9;background:#08071A;border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6F6AB8;font-size:10px}
.ws .sh .im img{width:100%;height:100%;object-fit:cover}
.ws .sh .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.qc{border-collapse:collapse;width:100%;font-size:14px}
table.qc td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.qc td:first-child{width:28px}
.folders{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.folders button{text-align:left;background:var(--wash);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;cursor:pointer}
.folders button[aria-pressed="true"]{border-color:var(--indigo);background:var(--lav);font-weight:600}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Steps">
    <div class="brand">Tech Script<br>Generator<small>indie.io creative</small></div>
    <ol class="steps" id="steps"></ol>
    <div class="foot"><div id="authBox"></div><div id="savedNote" style="margin-top:8px">Drafts save in this browser.</div></div>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="hd"><h3 id="dlgTitle"></h3><span class="spacer"></span><button class="btn ghost" id="dlgClose" aria-label="Close">Close</button></div><div class="bd" id="dlgBody"></div></dialog>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
const pad = n => String(n).padStart(2,"0");
const tc = s => { if (s == null || isNaN(s)) return "—"; s = Math.max(0, s); return pad(Math.floor(s/60)) + ":" + pad(Math.floor(s%60)); };
const parseTc = str => { const p = String(str).trim().split(":").map(Number); if (p.some(isNaN)) return null; return p.length === 1 ? p[0] : p.length === 2 ? p[0]*60+p[1] : p[0]*3600+p[1]*60+p[2]; };
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- state ---------- */
const STEPS = ["Brief","Sources","Analyse","Review shots","Music","Export"];
const VIDEO_TYPES = ["Trailer","Launch trailer","Release date announcement","Steam teaser","Console trailer","Social video","Event trailer","Other"];
const SHORT = {"Release date announcement":"RDA","Launch trailer":"Launch","Steam teaser":"Teaser","Console trailer":"Console","Social video":"Social","Event trailer":"Event","Trailer":"Trailer"};
const cutLabel = t => t==="Other" ? (S.project.videoTypeOther||"Other") : (SHORT[t]||t);
const cuts = () => (S.project.videoTypes&&S.project.videoTypes.length) ? S.project.videoTypes : ["Trailer"];
const shotsOf = c => S.shots.filter(x=>x.cut===c);
const activeCut = () => cuts().includes(S.activeCut) ? S.activeCut : cuts()[0];
const SUPER_TYPES = ["None","Lower Thirds","Title Card","Supers","Caption","Callout","Intro","End-card"];
const SHOT_TYPES = ["Full screen","Mid-shot","Close-up"];
const SOUNDS = ["None","Music","SFX","VO"];
const OLD_SUPER = {"Lower third":"Lower Thirds","Feature callout":"Callout","Gameplay mechanic":"Callout","Character name":"Supers","Custom":"Supers","Announcement":"Title Card","Release information":"End-card","Platform information":"Supers"};;
const STATUSES = ["Proposed","Approved","Needs capture","No screenshot"];
let S = {
  step:0,
  project:{game:"",videoTypes:["Release date announcement","Launch trailer"],videoTypeOther:"",durations:{},platform:"",aspect:"16:9",brief:"",messaging:"",mandatory:"",supersCap:5},
  activeCut:null,
  sources:[],      // {id,kind:'video'|'image'|'drive-ref',name,duration,driveUrl,thumb}
  frames:[],       // {id,sourceId,sourceName,t,dataUrl,kind}
  shots:[],        // {id,desc,purpose,edited,options:[{frame,reason}],recommended,selected,manual,superType,superText,sfx,notes,status,confirm:[]}
  analysis:null, missing:[], music:[], tracks:[],
  exportInfo:{sheetName:"",folderId:"",folderName:"My Drive",lastUrl:""}
};
const FILES = new Map(); // sourceId -> File (memory only)

/* IndexedDB draft */
const DB_NAME="tsg", STORE="s";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ const d=await idb(); d.transaction(STORE,"readwrite").objectStore(STORE).put(JSON.stringify(S),"cur"); $("#savedNote").textContent="Draft saved "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"."; }catch(e){ $("#savedNote").textContent="Draft not saved in this browser."; } },500); }
async function load(){ try{ const d=await idb(); const v=await new Promise(r=>{ const q=d.transaction(STORE).objectStore(STORE).get("cur"); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); if(v){ const o=JSON.parse(v); S=Object.assign(S,o); S.project=Object.assign({}, S.project, o.project); } if(!Array.isArray(S.project.videoTypes)) S.project.videoTypes=[S.project.videoType||"Trailer"]; if(!S.project.durations) S.project.durations={}; if(S.project.duration&&!S.project.durations[S.project.videoTypes[0]]) S.project.durations[S.project.videoTypes[0]]=S.project.duration; S.shots.forEach(x=>{ if(!x.cut) x.cut=S.project.videoTypes[0]; }); if(!Array.isArray(S.tracks)) S.tracks=[]; S.shots.forEach(x=>{ if(OLD_SUPER[x.superType]) x.superType=OLD_SUPER[x.superType]; if(!SUPER_TYPES.includes(x.superType)) x.superType="None"; if(x.sfx&&!x.soundDesc){ x.soundDesc=x.sfx; x.sound="SFX"; } if(!x.sound) x.sound="None"; if(!x.shotType) x.shotType="Full screen"; }); }catch(e){} }

/* ---------- capabilities ---------- */
let SAMPLE=null, MCP=null, DL=null, IMG_LIMITS=null;
const DRIVE="Google Drive";
/* ===== Vercel runtime: Google sign-in, Drive REST, Claude via /api/claude ===== */
let CFG={}, GTOKEN=null, GEXP=0, GEMAIL="", tokenClient=null, tokenWaiters=[];
const SCOPES="openid email https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";
function renderAuth(){
  const box=$("#authBox"); if(!box) return;
  if(!CFG.googleClientId){ box.replaceChildren(h("span",{class:"note",style:"color:#FFB3B3"},CFG.configError==="api"?"The /api routes aren't deployed. In Vercel, set Root Directory to the folder that contains index.html and the api folder, then redeploy.":"GOOGLE_CLIENT_ID isn't set for this deployment. Add it in Vercel → Settings → Environment Variables (Production), then redeploy.")); return; }
  box.replaceChildren(GTOKEN?h("div",null,h("div",{style:"font-size:12px;color:#C9C5F2"},"Signed in"),h("div",{style:"font-size:12px;word-break:break-all"},GEMAIL||"Google account"),h("button",{class:"btn small",style:"margin-top:6px",onclick:signOut},"Sign out"))
    :h("button",{class:"btn small",onclick:()=>signIn(true)},"Sign in with Google"));
}
function signIn(interactive){
  return new Promise((res,rej)=>{
    if(!window.google||!google.accounts||!google.accounts.oauth2){ rej(new Error("Google sign-in didn't load. Reload the page.")); return; }
    if(!tokenClient) tokenClient=google.accounts.oauth2.initTokenClient({client_id:CFG.googleClientId,scope:SCOPES,callback:async r=>{
      const w=tokenWaiters.splice(0);
      if(r.error){ w.forEach(x=>x.rej(new Error(r.error_description||r.error))); return; }
      GTOKEN=r.access_token; GEXP=Date.now()+((Number(r.expires_in)||3500)-60)*1000;
      try{ const u=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+GTOKEN}}).then(x=>x.json()); GEMAIL=u.email||""; }catch(e){}
      sessionStorage.setItem("tsg_hint",GEMAIL||"");
      await sendTokenToSW(); MCP=driveMCP; renderAuth(); render(); w.forEach(x=>x.res(GTOKEN));
    }});
    tokenWaiters.push({res,rej});
    tokenClient.requestAccessToken({prompt:interactive?"":"none",login_hint:sessionStorage.getItem("tsg_hint")||undefined});
  });
}
function signOut(){ if(GTOKEN&&window.google) google.accounts.oauth2.revoke(GTOKEN,()=>{}); GTOKEN=null; GEMAIL=""; MCP=null; sessionStorage.removeItem("tsg_hint"); renderAuth(); render(); }
async function token(){ if(GTOKEN&&Date.now()<GEXP) return GTOKEN; return signIn(false).catch(()=>signIn(true)); }
const DAPI="https://www.googleapis.com/drive/v3";
async function gfetch(url,opts={}){ const t=await token(); const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:"Bearer "+t},opts.headers||{})}));
  if(!r.ok){ let m=""; try{ m=(await r.json()).error.message; }catch(e){} const err=new Error(m||("Google Drive returned "+r.status)); err.code=r.status===401?"needs_reauth":r.status===403?"blocked_by_policy":"tool_error"; throw err; } return r; }

    ["Sources",S.sources.map(x=>x.name+(linkUrl(x)?" — "+linkUrl(x):"")).join("\n")],["Created",new Date().toISOString().slice(0,10)]];
  info.forEach(([k,v],i)=>{ const a2=br.getCell(i+2,1), b2=br.getCell(i+2,2); a2.value=k; b2.value=v==null?"":v; a2.fill=fill(MI); a2.font={name:"Arial",size:10,bold:true,color:{argb:WH}}; b2.font={name:"Arial",size:10,color:{argb:INK}}; [a2,b2].forEach(x=>{ x.alignment={vertical:"middle",wrapText:true,indent:1}; x.border={bottom:thin}; }); });
  return await wb.xlsx.writeBuffer();
}
function b64(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function defaultName(){ const p=S.project; const code=(p.game||"UNTITLED").replace(/[^A-Za-z0-9]/g,"").slice(0,4).toUpperCase(); const vt=cuts().map(c=>cutLabel(c).replace(/[^A-Za-z0-9]+/g,"-")).join("-").toUpperCase(); return code+"-"+vt+"-technical_script"; }
async function doDownload(btn,msg){
  btn.disabled=true; msg.textContent="Building the spreadsheet…"; msg.className="note";
  try{ const buf=await buildXlsx(); const name=(S.exportInfo.sheetName||defaultName())+".xlsx";
    await DL.save({filename:name,data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}); msg.textContent="Saved "+name+"."; msg.className="okc"; }
  catch(e){ msg.textContent=e&&e.code==="declined"?"Download cancelled.":"Couldn't save the file: "+((e&&e.message)||"unknown error"); msg.className="err"; }
  btn.disabled=false;
}
async function doDrive(btn,msg){
  btn.disabled=true; msg.textContent="Building the spreadsheet…"; msg.className="note";
  try{
    const buf=await buildXlsx();
    const input={title:S.exportInfo.sheetName||defaultName(),base64Content:b64(buf),contentMimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
    let parentOk=false;
    if(S.exportInfo.folderId){ try{ const d=await MCP.describeTool(DRIVE,"create_file"); parentOk=!!(d&&d.inputSchema&&d.inputSchema.properties&&d.inputSchema.properties.parentId); }catch(_){} if(parentOk) input.parentId=S.exportInfo.folderId; }
    msg.textContent="Creating the Google Sheet…";
    const p=await drive("create_file",input);
    if(S.exportInfo.folderId&&!parentOk&&p&&p.id){ try{ await drive("update_file",{fileId:p.id,parentId:S.exportInfo.folderId}); }catch(e){ msg.textContent="Sheet created in My Drive, but moving it to "+S.exportInfo.folderName+" failed: "+mcpErr(e); } }
    S.exportInfo.lastUrl=(p&&p.viewUrl)||""; save(); render();
  }catch(e){ msg.textContent=mcpErr(e)+" Nothing was created if this happened before the upload; check Drive before trying again."; msg.className="err"; btn.disabled=false; }
}

    h("div",{class:"panel"},h("h2",{style:"margin-top:0"},"Final check"),h("table",{class:"qc"},items.map(([ok,t])=>h("tr",null,h("td",{class:ok?"okc":"err"},ok?"✓":"!"),h("td",null,t))))),
    h("div",{class:"panel",style:"margin-top:16px"},
      h("label",{class:"f"},"Google Sheet name",name),
      h("h2",null,"Destination folder"),
      MCP?folderPicker(f=>{ ei.folderId=f.id; ei.folderName=f.title; save(); const c=$("#confirmFolder"); if(c) c.textContent=f.title; },"Search for the folder to save into. Leave unpicked to save to My Drive."):h("p",{class:"note"},"Sign in with Google to save straight to Drive, or download the .xlsx."),
      h("h2",null,"Confirm"),
      h("table",{class:"qc"},
        h("tr",null,h("td",null,""),h("td",null,h("b",null,"Folder: "),h("span",{id:"confirmFolder"},ei.folderName||"My Drive"))),
        h("tr",null,h("td",null,""),h("td",null,h("b",null,"Game: "),p.game||"(not set)")),
        h("tr",null,h("td",null,""),h("td",null,h("b",null,"Video types: "),cuts().map(cutLabel).join(" + "))),
        cuts().map(c=>h("tr",null,h("td",null,""),h("td",null,h("b",null,cutLabel(c)+" shots: "),shotsOf(c).map((s,i)=>pad(i+1)).join(" ")||"none")))),
      h("div",{class:"row",style:"margin-top:16px"},
        h("button",{class:"btn primary",disabled:!MCP||!S.shots.length,onclick:e=>doDrive(e.currentTarget,gmsg)},"Create Google Sheet"),
        h("button",{class:"btn",disabled:!DL||!S.shots.length,onclick:e=>doDownload(e.currentTarget,dmsg)},"Download .xlsx")),
      gmsg,dmsg,

    ),

  ];

/* ---------- render ---------- */
function render(){
  renderRail();
  const views=[stepBrief,stepSources,stepAnalyse,stepReview,stepMusic,stepExport];
  $("#main").replaceChildren(...views[S.step]().flat().filter(Boolean));
  updateCounter();
